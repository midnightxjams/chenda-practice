<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chenda Two-Part Practice Workspace</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<main class="app" id="app">
  <header class="topBar">
    <div class="brand">
      <h1>Chenda Practice Trainer</h1>
      <div class="songTitle" id="songTitle">Unsaved practice song</div>
    </div>
    <div class="status"><span class="dot"></span><span id="state">Stopped</span></div>
  </header>

  <section class="controlBar" aria-label="Shared song controls">
    <div class="controlGroup songControls">
      <label for="savedSongs">Saved Song</label>
      <select id="savedSongs" aria-label="Saved Song"></select>
      <div class="buttonRow">
        <button type="button" id="newSong">New Song</button>
        <button type="button" class="secondary" id="editSong">Edit Song</button>
        <button type="button" class="danger" id="deleteSong">Delete Song</button>
      </div>
    </div>

    <div class="controlGroup bpmControls">
      <label for="bpm">BPM</label>
      <div class="bpmRow">
        <input id="bpm" type="range" min="100" max="500" value="120">
        <input id="bpmNumber" class="bpmNumber" type="number" min="100" max="500" value="120" inputmode="numeric" aria-label="BPM number">
      </div>
    </div>

    <div class="controlGroup metronomeControls">
      <label>Metronome</label>
      <div class="metroRow">
        <button type="button" class="toggle" id="metronomeToggle" aria-pressed="false">Off</button>
        <label class="inlineControl" for="metronomeVolume"><span>Vol</span><input id="metronomeVolume" type="range" min="0" max="1" step="0.05" value="0.3"></label>
        <label class="inlineControl" for="metronomeSubdivision"><span>Pulse</span><select id="metronomeSubdivision" aria-label="Metronome pulse"><option value="1">1x</option><option value="2">1/2x</option><option value="4">1/4x</option></select></label>
      </div>
    </div>

    <div class="controlGroup loopControls">
      <label>Loop</label>
      <div class="loopChoices">
        <button type="button" class="loop" data-loop="1">x1</button>
        <button type="button" class="loop" data-loop="2">x2</button>
        <button type="button" class="loop active" data-loop="4">x4</button>
        <button type="button" class="loop" data-loop="6">x6</button>
        <button type="button" class="loop" data-loop="Infinity">&infin;</button>
      </div>
    </div>

    <div class="controlGroup transportControls">
      <label>Practice</label>
      <div class="transportRow">
        <button id="start" type="button">Start</button>
        <button class="secondary" id="stop" type="button">Stop</button>
        <button class="accent" id="restart" type="button">Restart</button>
        <button id="fullscreen" type="button">Fullscreen</button>
      </div>
    </div>
  </section>

  <section class="insertBar" aria-label="Pattern insert controls">
    <div class="activeEditor" id="activeEditorLabel">Editing: Treble</div>
    <div class="insertButtons" id="insertButtons"></div>
  </section>

  <section class="practiceStatus" aria-label="Playback status">
    <span id="sectionIndicator">Section -</span>
    <span id="loopStatus">Loop: 0 / x4</span>
    <span id="playTimer">00:00</span>
  </section>

  <section class="partGrid">
    <article class="partPanel treblePanel">
      <header class="partHead">
        <h2>TREBLE / CHENDA</h2>
        <span id="trebleNow">Ready</span>
      </header>
      <div class="laneBox">
        <canvas id="trebleLane" width="720" height="520" aria-label="Treble left and right hand note lanes"></canvas>
        <div class="hitText">Fixed line</div>
      </div>
      <details class="partEditorArea" open>
        <summary>Treble / Chenda Pattern</summary>
        <div class="sectionEditors" id="trebleEditors"></div>
      </details>
    </article>

    <article class="partPanel bassPanel">
      <header class="partHead">
        <h2>BASS</h2>
        <span id="bassNow">Ready</span>
      </header>
      <div class="laneBox">
        <canvas id="bassLane" width="720" height="520" aria-label="Bass left and right hand note lanes"></canvas>
        <div class="hitText">Fixed line</div>
      </div>
      <details class="partEditorArea" open>
        <summary>Bass Pattern</summary>
        <div class="sectionEditors" id="bassEditors"></div>
      </details>
    </article>
  </section>

  <details class="definitions" id="wordDefinitions">
    <summary>Word &amp; Rest Definitions</summary>
    <div class="definitionList" id="wordDefinitionList"></div>
  </details>

  <footer class="appFooter">Chenda Practice Trainer v0.1.0</footer>

  <div class="modalOverlay" id="songModal" hidden>
    <div class="songModal" role="dialog" aria-modal="true" aria-labelledby="songModalTitle">
      <div class="modalHead">
        <h2 id="songModalTitle">Song</h2>
        <button type="button" class="secondary closeButton" id="cancelSongTop" aria-label="Close song editor">×</button>
      </div>
      <div class="modalBody">
        <div class="field">
          <label for="songNameInput">Song name</label>
          <input id="songNameInput" type="text" autocomplete="off">
        </div>
        <div class="sectionEditorToolbar">
          <span>Song Sections</span>
          <button type="button" id="addSection">Add Section</button>
        </div>
        <div class="sectionEditorList" id="sectionEditorList"></div>
      </div>
      <div class="modalActions">
        <button type="button" id="saveSong">Save Song</button>
        <button type="button" class="secondary" id="cancelSong">Cancel</button>
      </div>
    </div>
  </div>

  <div class="fullscreenControls" id="fullscreenControls">
    <button class="secondary" id="fullscreenStop" type="button">Stop</button>
    <button class="accent" id="fullscreenRestart" type="button">Restart</button>
    <button id="exitFullscreen" type="button">Exit</button>
  </div>
</main>
<script src="script.js"></script>
</body>
</html>
